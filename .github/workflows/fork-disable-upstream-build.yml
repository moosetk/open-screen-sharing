name: Fork - Disable upstream Build

# This fork only ships the unsigned macOS build from fork-build-macos.yml.
# Upstream's build.yml (iOS builds and nightly releases) is disabled as a
# repository setting instead of being edited, so upstream merges stay clean.

on:
  push:
    branches:
      - main
      - cursor/restore-hardware-display-mode-f8de
  workflow_dispatch:

permissions: {}

jobs:
  disable:
    name: Disable upstream Build workflow
    if: github.repository != 'nekohasekai/open-screen-sharing'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Disable build.yml and cancel its unfinished runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |-
          STATE=$(gh api "repos/$GH_REPO/actions/workflows/build.yml" --jq .state)
          echo "build.yml state: $STATE"
          if [ "$STATE" = active ]; then
            gh api -X PUT "repos/$GH_REPO/actions/workflows/build.yml/disable"
            echo "disabled"
          fi
          for RUN in $(gh api "repos/$GH_REPO/actions/workflows/build.yml/runs?per_page=20" \
            --jq '.workflow_runs[] | select(.status != "completed") | .id'); do
            gh api -X POST "repos/$GH_REPO/actions/runs/$RUN/cancel" && echo "cancelled run $RUN"
          done
          echo "build.yml state now: $(gh api "repos/$GH_REPO/actions/workflows/build.yml" --jq .state)"
